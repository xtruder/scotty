# This rule is not used by the project scotty itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the scotty.x-truder.net.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: scotty
    app.kubernetes.io/managed-by: kustomize
  name: aitask-editor-role
rules:
- apiGroups:
  - scotty.x-truder.net
  resources:
  - aitasks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - scotty.x-truder.net
  resources:
  - aitasks/status
  verbs:
  - get
